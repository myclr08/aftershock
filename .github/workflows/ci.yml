name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  analyzer:
    name: Analyzer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test
        run: >
          dotnet test analyzer/Aftershock.Analyzer.sln -c Release
          --logger trx --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  extension:
    name: Extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: extension
    env:
      # dotnet child processes must not leave MSBuild nodes or servers behind (docs/DESIGN.md 6.1.1).
      MSBUILDDISABLENODEREUSE: "1"
      DOTNET_CLI_USE_MSBUILD_SERVER: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests
        run: npm test

      - name: Bundle the analyzer (dotnet publish into dist/analyzer)
        run: npm run bundle-analyzer

      - name: End-to-end (core against samples/ImpactSample)
        run: npm run test:e2e

      - name: Integration test in VS Code 1.85 (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      - name: Integration test in VS Code 1.85
        if: runner.os == 'Windows'
        run: npm run test:integration

      - name: Package the VSIX
        shell: bash
        run: npx @vscode/vsce package -o "aftershock-${{ runner.os }}.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.os }}
          path: extension/aftershock-*.vsix
          if-no-files-found: error
          retention-days: 14
